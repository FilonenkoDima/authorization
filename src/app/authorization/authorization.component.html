<div class="d-flex justify-content-center">
  <mat-card appearance="outlined" class="p-4 w-50">
    <form [formGroup]="form" class="d-flex flex-column">
      <mat-form-field>
        <mat-label>Email</mat-label>
        <input matInput formControlName="email" placeholder="Ex. pat@example.com" type="email"/>
        <mat-error>Please enter a valid email address.</mat-error>
      </mat-form-field>

      <mat-form-field>
        <mat-label>Password</mat-label>
        <input matInput [type]="hide ? 'password' : 'text'" formControlName="password" placeholder="********"
               type="password"/>
        <mat-icon matSuffix (click)="hide = !hide">{{ hide ? 'visibility_off' : 'visibility' }}</mat-icon>
        <mat-error>Please enter a valid password.</mat-error>
      </mat-form-field>

      <div>
        <button (click)="onLogin()" class="btn btn-primary w-100">Sign in</button>
      </div>
    </form>
  </mat-card>
</div>
