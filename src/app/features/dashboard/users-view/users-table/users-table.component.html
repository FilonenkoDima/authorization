<div class="d-flex justify-content-between align-items-center">
  <mat-form-field>
    <mat-label>Filter</mat-label>
    <input matInput (keyup)="applyFilter($event)" placeholder="Ex. Mia" #input>
  </mat-form-field>
  <button class="btn btn-primary" (click)="downloadCSV()">Download as .csv</button>
</div>
<div class="mat-elevation-z8 table-container d-flex flex-column justify-content-between">
  <table mat-table [dataSource]="dataSource" matSort>

    @for (data of displayedColumns(); track $index) {
      <ng-container [matColumnDef]="data">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>{{ data | capitalizeFirst }}</th>
        <td mat-cell *matCellDef="let row"> {{ row[data] }}</td>
      </ng-container>
    }

    <tr mat-header-row *matHeaderRowDef="displayedColumns(); sticky: true"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns();"></tr>

    <tr class="mat-row" *matNoDataRow>
      <td class="mat-cell" colspan="6">No data matching the filter "{{ input.value }}"</td>
    </tr>
  </table>

  <mat-paginator class="sticky-bottom bg-info" [pageSizeOptions]="pageSizeOptions()"></mat-paginator>
</div>
